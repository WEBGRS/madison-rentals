<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isthmus Rentals</title>
<meta name="description" content="Map of rentals near the UW–Madison campus, merged from landlord websites and the UW off-campus listing service, with every missing or unclear field marked.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E6F8E'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-style='italic' font-size='22' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=cb3f2255">
<script src="theme.js?v=f138724b"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark">Isthmus</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" class="tab active" data-view="grid" data-i18n="tab_grid">All rentals</button>
    <button role="tab" class="tab" data-view="map" data-i18n="tab_map">Map</button>
    <button role="tab" class="tab" data-view="gaps" data-i18n="tab_gaps" hidden>Missing info</button>
    <button role="tab" class="tab" data-view="sources" data-i18n="tab_sources">Sources</button>
  </nav>
  <div class="top-right">
    <button class="lang ap-btn" id="appearance" aria-label="Appearance"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg><span data-i18n="appearance">Appearance</span></button>
    <button class="lang" id="lang" aria-label="Switch language">中文</button>
  </div>
</header>

<main id="view-grid" class="view active">
  <aside class="grail" id="grail"></aside>
  <section class="gwrap" id="gwrap">
    <ol class="grid" id="grid"></ol>
    <button class="btn ghost gmore" id="gmore" type="button" hidden></button>
  </section>
  <article class="gpage" id="gpage" hidden></article>
</main>

<main id="view-map" class="view">
  <aside class="rail" id="rail">
    <div class="filters">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Street, building or landlord">
      <div class="field">
        <span class="lbl" data-i18n="bedrooms">Bedrooms</span>
        <div class="chips" id="beds">
          <button data-b="0" data-i18n="studio">Studio</button><button data-b="1">1</button><button data-b="2">2</button><button data-b="3">3</button><button data-b="4">4</button><button data-b="5">5+</button>
        </div>
      </div>
      <div class="field places">
        <div class="lbl-row">
          <span class="lbl" data-i18n="places">My places</span>
          <button class="linkish" id="place-add" type="button" aria-expanded="false" aria-controls="place-form" data-i18n="place_add">+ Add a place</button>
        </div>
        <div class="place-chips" id="place-chips"></div>
        <div class="place-form" id="place-form" hidden>
          <div class="pf-row">
            <input id="place-q" type="search" autocomplete="off" data-i18n-ph="place_q_ph" placeholder="Building, business or street address">
            <button class="btn small" id="place-search" type="button" data-i18n="place_search">Search</button>
          </div>
          <div class="pf-row">
            <button class="linkish" id="place-map" type="button" data-i18n="place_map">Click a spot on the map</button>
            <button class="linkish" id="place-gps" type="button" data-i18n="place_gps">Use my current location</button>
          </div>
          <ol class="place-results" id="place-results"></ol>
          <p class="place-msg" id="place-msg" hidden></p>
          <div class="pf-row" id="place-name-row" hidden>
            <input id="place-name" type="text" maxlength="40" data-i18n-ph="place_name_ph" placeholder="Name it, e.g. Lab or Gym">
            <button class="btn small" id="place-save" type="button" data-i18n="place_save">Save</button>
            <button class="linkish" id="place-cancel" type="button" data-i18n="place_cancel">Cancel</button>
          </div>
        </div>
      </div>
      <button class="ftoggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="fbody"><span><span data-i18n="ftoggle">Price, distance and more</span><span id="ftoggle-n" class="more-n"></span></span></button>
      <div class="fbody" id="fbody">
      <div class="field">
        <div class="lbl-row">
          <span class="lbl" id="price-lbl"></span>
          <div class="seg" id="basis">
            <button data-basis="bed" class="on" data-i18n="per_person">Per person</button><button data-basis="unit" data-i18n="whole_unit">Whole unit</button>
          </div>
        </div>
        <div class="dual" id="price-range">
          <div class="dual-track"><div class="dual-fill" id="price-fill"></div></div>
          <input type="range" id="price-min" min="500" max="3000" step="50" value="500" aria-label="Lowest price">
          <input type="range" id="price" min="500" max="3000" step="50" value="3000" aria-label="Highest price">
        </div>
        <label class="switch"><input type="checkbox" id="f-noshared" checked> <span data-i18n="noshared">Leave out shared rooms (two people per bedroom)</span></label>
      </div>
      <div class="field">
        <div class="lbl-row">
          <span class="lbl" id="dist-lbl"></span>
          <select id="ref" aria-label="Distance from"></select>
        </div>
        <div class="dual">
          <div class="dual-track"><div class="dual-fill" id="dist-fill"></div></div>
          <input type="range" id="dist" min="0.25" max="2" step="0.05" value="2" aria-label="Distance">
        </div>
      </div>
      <div class="field two">
        <label><span class="lbl" data-i18n="lease">Lease</span>
          <select id="term">
            <option value="" data-i18n="term_any">Any</option>
            <option value="2027-28" data-i18n="term_2728">Fall 2027 (2027–28)</option>
            <option value="now / 2026-27" data-i18n="term_now">Now / 2026–27 &amp; sublets</option>
            <option value="unknown" data-i18n="term_unknown">Not stated</option>
          </select></label>
        <label><span class="lbl" data-i18n="sort">Sort</span>
          <select id="sort">
          </select></label>
      </div>
      <details class="more">
        <summary><span data-i18n="more">More filters</span><span id="more-n" class="more-n"></span></summary>
        <div class="checks">
          <label><input type="checkbox" id="f-priced"> <span data-i18n="f_priced">Has a posted price</span></label>
          <label><input type="checkbox" id="f-heat"> <span data-i18n="f_heat">Heat included</span></label>
          <label><input type="checkbox" id="f-allutil"> <span data-i18n="f_allutil">All utilities included</span></label>
          <label><input type="checkbox" id="f-net"> <span data-i18n="f_net">Internet included</span></label>
          <label><input type="checkbox" id="f-cats"> <span data-i18n="f_cats">Cats allowed</span></label>
          <label><input type="checkbox" id="f-dogs"> <span data-i18n="f_dogs">Dogs allowed</span></label>
          <label><input type="checkbox" id="f-inunit"> <span data-i18n="f_inunit">In-unit laundry</span></label>
          <label><input type="checkbox" id="f-parking"> <span data-i18n="f_parking">Parking offered</span></label>
          <label><input type="checkbox" id="f-furn"> <span data-i18n="f_furn">Furnished</span></label>
          <label><input type="checkbox" id="f-ac"> <span data-i18n="f_ac">Air conditioning</span></label>
        </div>
        <label class="ll"><span class="lbl" data-i18n="landlord">Landlord</span><select id="landlord"><option value="" data-i18n="all_landlords">All landlords</option></select></label>
      </details>
      </div>
      <div class="result-bar">
        <span id="count"></span>
        <span class="bar-actions">
          <button class="linkish" id="reset" data-i18n="reset">Reset</button>
          <button class="linkish" id="export" data-i18n="export">Download CSV</button>
        </span>
      </div>
    </div>
    <ol class="results" id="results"></ol>
  </aside>
  <section class="mapwrap">
    <div id="map" aria-label="Map of rentals"></div>
    <div class="legend" id="legend"></div>
    <div class="pick-hint" id="pick-hint" hidden><span data-i18n="pick_hint">Click the map to place it.</span><button type="button" id="pick-cancel" data-i18n="pick_cancel">Cancel</button></div>
    <article class="drawer" id="drawer" aria-live="polite" hidden></article>
  </section>
</main>

<main id="view-gaps" class="view">
  <div class="gaps-layout">
    <aside class="gaps-list">
      <p class="gaps-intro" data-i18n="gaps_intro">Every property below is missing something a renter needs, or has a value that disagrees between sources. Pick a landlord to see what to ask them.</p>
      <ol id="gap-landlords"></ol>
    </aside>
    <section class="gaps-detail" id="gap-detail"></section>
  </div>
</main>

<main id="view-sources" class="view">
  <div class="sources" id="sources"></div>
</main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Floor plan">
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="lb-close" id="lb-close" type="button" aria-label="Close">×</button>
</div>
<button id="viewswitch" class="viewswitch" type="button"></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/transit.js?v=7d94bb8b"></script>
<script src="data/config.js?v=36a0155d"></script>
<script src="engine.js?v=fce5e301"></script>
<script src="guard-client.js?v=9af92d3c"></script>
<script src="app.js?v=ec18cb4b"></script>
<script src="feedback.js?v=f6ff8df4" data-site="rentals" data-star="WEBGRS/madison-rentals" data-float-bottom-narrow="94" data-narrow-max="860" defer></script>
</body>
</html>
